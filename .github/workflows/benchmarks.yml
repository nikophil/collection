name: Benchmarks

# Only changes that can move a measurement run the benchmarks.
on:
  push:
    branches: [0.2.x]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'composer.json'
      - 'phpbench.json'
      - 'bin/compare-benchmarks.sh'
      - 'bin/aggregate-benchmarks.php'
      - '.github/workflows/benchmarks.yml'
  # Every base branch, so that stacked pull requests are checked too.
  pull_request:
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'composer.json'
      - 'phpbench.json'
      - 'bin/compare-benchmarks.sh'
      - 'bin/aggregate-benchmarks.php'
      - '.github/workflows/benchmarks.yml'

jobs:
  phpbench:
    name: PHPBench (machine ${{ matrix.machine }})
    runs-on: ubuntu-latest
    # A pull request is compared on five machines at once: the summary job keeps the changes
    # that most of them agree on.
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ github.event_name == 'pull_request' && fromJSON('[1, 2, 3, 4, 5]') || fromJSON('[1]') }}
    steps:
      - uses: actions/checkout@v7

      # The base branch goes to its own directory, so that both versions can be benchmarked
      # in turn.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # The local executor cannot turn Xdebug off through runner.php_config.
          coverage: none

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          if [ -f base/phpbench.json ]; then
            composer install --no-interaction --prefer-dist --working-dir=base
          fi

      # The comparison is informative only: it never fails the build.
      # Until phpbench lands on the base branch, there is nothing to compare against.
      - name: Compare with the base branch
        if: hashFiles('base/phpbench.json') != ''
        run: GROUP=guard THRESHOLD=10 bin/compare-benchmarks.sh base

      - uses: actions/upload-artifact@v7
        if: hashFiles('var/compare.tsv') != ''
        with:
          name: comparison-${{ matrix.machine }}
          path: |
            var/compare.tsv
            var/confirm.tsv
          if-no-files-found: ignore

      # Without a base to compare against, this only checks that every benchmark still
      # runs, with a single revolution of a single iteration.
      - name: Run benchmarks once
        if: hashFiles('base/phpbench.json') == ''
        run: vendor/bin/phpbench run --iterations=1 --revs=1 --stop-on-error --ansi --progress=plain

  summary:
    name: PHPBench (summary over the machines)
    needs: phpbench
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: comparison-*
          path: comparisons

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # The summary also goes to the run page.
      - name: Summarize the comparisons
        run: |
          if [ ! -d comparisons ]; then
            echo "Nothing was compared."
            exit 0
          fi
          php bin/aggregate-benchmarks.php 10 comparisons/* | tee summary.txt
          { echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
