name: Benchmarks

on:
  push:
    branches: [0.2.x]
  # Every base branch, so that stacked pull requests are checked too.
  pull_request:

jobs:
  phpbench:
    name: PHPBench (comparison with the base branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # The local executor cannot turn Xdebug off through runner.php_config.
          coverage: none

      # Until phpbench lands on the base branch, there is nothing to compare against.
      - name: Benchmark the base branch
        if: github.event_name == 'pull_request' && hashFiles('phpbench.json') != ''
        run: |
          composer install --no-interaction --prefer-dist
          vendor/bin/phpbench run --tag=base --executor=local --iterations=4 --ansi --progress=plain

      # clean: false keeps var/phpbench, where the base results are stored.
      - uses: actions/checkout@v7
        with:
          clean: false

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Both runs share the runner, so its noise affects them alike. The comparison is
      # informative only: it never fails the build. The local executor runs every
      # iteration in one process: spawning one per iteration would more than double the job.
      # Four iterations rather than three steady the comparison; --revs is left alone, since it
      # would override the revolutions of the constant-time subjects. --ansi keeps the colours,
      # which tell faster from slower at a glance.
      # The plain progress writes one line per variant: the default one rewrites its line
      # with carriage returns, which the job log does not render.
      - name: Compare with the base branch
        if: hashFiles('var/phpbench/**') != ''
        run: vendor/bin/phpbench run --ref=base --executor=local --iterations=4 --report=compare --stop-on-error --ansi --progress=plain

      # Without a base to compare against, this only checks that every benchmark still
      # runs, with a single revolution of a single iteration.
      - name: Run benchmarks once
        if: hashFiles('var/phpbench/**') == ''
        run: vendor/bin/phpbench run --iterations=1 --revs=1 --stop-on-error --ansi --progress=plain
