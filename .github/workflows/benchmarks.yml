name: Benchmarks

# Only changes that can move a measurement run the benchmarks.
on:
  push:
    branches: [0.2.x]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'composer.json'
      - 'phpbench.json'
      - 'bin/compare-benchmarks.sh'
      - '.github/workflows/benchmarks.yml'
  # Every base branch, so that stacked pull requests are checked too.
  pull_request:
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'composer.json'
      - 'phpbench.json'
      - 'bin/compare-benchmarks.sh'
      - '.github/workflows/benchmarks.yml'

jobs:
  phpbench:
    name: PHPBench (comparison with the base branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The base branch goes to its own directory, so that both versions can be benchmarked
      # in turn.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # The local executor cannot turn Xdebug off through runner.php_config.
          coverage: none

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          if [ -f base/phpbench.json ]; then
            composer install --no-interaction --prefer-dist --working-dir=base
          fi

      # The comparison is informative only: it never fails the build.
      # Until phpbench lands on the base branch, there is nothing to compare against.
      - name: Compare with the base branch
        if: hashFiles('base/phpbench.json') != ''
        run: bin/compare-benchmarks.sh base

      # Without a base to compare against, this only checks that every benchmark still
      # runs, with a single revolution of a single iteration.
      - name: Run benchmarks once
        if: hashFiles('base/phpbench.json') == ''
        run: vendor/bin/phpbench run --iterations=1 --revs=1 --stop-on-error --ansi --progress=plain
