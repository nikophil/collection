name: CI

on:
  push:
    branches: [0.2.x]
  pull_request:
    branches: [0.2.x]

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.php == '8.4'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: vendor/bin/phpcs

  phpbench:
    name: PHPBench (comparison with the base branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # The local executor cannot turn Xdebug off through runner.php_config.
          coverage: none

      # Until phpbench lands on the base branch, there is nothing to compare against.
      - name: Benchmark the base branch
        if: github.event_name == 'pull_request' && hashFiles('phpbench.json') != ''
        run: |
          composer install --no-interaction --prefer-dist
          vendor/bin/phpbench run --tag=base --executor=local --progress=none

      # clean: false keeps var/phpbench, where the base results are stored.
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Both runs share the runner, so its noise affects them alike. The comparison is
      # informative only: it never fails the build. The local executor runs every
      # iteration in one process: spawning one per iteration would more than double the job.
      - name: Compare with the base branch
        if: hashFiles('var/phpbench/**') != ''
        run: vendor/bin/phpbench run --ref=base --executor=local --report=aggregate --stop-on-error --progress=none

      # Without a base to compare against, this only checks that every benchmark still
      # runs, with a single revolution of a single iteration.
      - name: Run benchmarks once
        if: hashFiles('var/phpbench/**') == ''
        run: vendor/bin/phpbench run --iterations=1 --revs=1 --stop-on-error --progress=none

  codegen:
    name: Codegen (generated code in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Regenerate all narrowing + self-preserving code
        run: php bin/generate-all.php

      - name: Fail if regeneration changed committed files
        run: git diff --exit-code -- src/
